<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>えほん ぼうけん</title>
<meta name="theme-color" content="#DDF3FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFF8E7;--sky:#DDF3FF;--ink:#3B2F2F;--soft:#8A7B74;--sun:#FFD86B;--berry:#FFA3C1;--leaf:#A6E3A1;--pond:#9BD4FF;--grape:#CDB4F5;--bubble:#FFFFFF;--shadow:rgba(70,40,20,.18)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c","BIZ UDPGothic",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--paper) 55%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #app{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:12px 14px 16px;overflow:hidden}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
  .icon{font-size:26px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 var(--shadow)}
  .party{flex:1;font-size:26px;text-align:center;line-height:1}
  .pts{font-size:22px;font-weight:900;background:#fff;border-radius:22px;padding:6px 14px;box-shadow:0 3px 0 var(--shadow)}
  .pts span{animation:pop .4s cubic-bezier(.2,1.6,.4,1);display:inline-block}
  .stage{flex:0 0 auto;min-height:150px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font-size:84px;line-height:1;text-align:center;margin:8px 0 6px}
  .stage.count{font-size:52px;gap:10px;padding:8px}
  .stage.letter{font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 0 var(--shadow),0 0 0 6px var(--ink)}
  .bubble{position:relative;background:var(--bubble);border-radius:26px;padding:18px 20px;font-size:22px;font-weight:700;line-height:1.55;box-shadow:0 5px 0 var(--shadow);display:flex;align-items:center;gap:10px}
  .bubble:before{content:"";position:absolute;top:-14px;left:44px;border:9px solid transparent;border-bottom-color:var(--bubble);border-top:0}
  .bubble .txt{flex:1}
  .bubble .say{font-size:28px;background:none;border:0;line-height:1}
  .choices{margin-top:auto;padding-top:14px;display:grid;gap:12px}
  .choices.two{grid-template-columns:1fr 1fr}
  .choices.three{grid-template-columns:1fr 1fr 1fr}
  .btn{border:0;border-radius:24px;padding:18px 10px;font-family:inherit;font-weight:900;font-size:28px;line-height:1.2;color:var(--ink);background:var(--sun);box-shadow:0 7px 0 var(--shadow);transition:transform .08s;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .btn b{font-size:46px;line-height:1}
  .btn small{font-size:17px;font-weight:700;color:var(--soft)}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
  .btn:disabled{opacity:.4;box-shadow:0 3px 0 var(--shadow)}
  .btn.c1{background:var(--sun)}.btn.c2{background:var(--berry)}.btn.c3{background:var(--leaf)}.btn.c4{background:var(--pond)}.btn.c5{background:var(--grape)}
  .btn.big{font-size:42px}
  .btn.sm{font-size:20px;min-height:72px;padding:12px 6px}
  .btn.sm b{font-size:40px}
  .btn.wrong{animation:wiggle .5s;opacity:.55}
  .btn.right{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
  .title h1{font-size:38px;font-weight:900;letter-spacing:.04em;line-height:1.3}
  .title h1 span{display:block;font-size:64px;line-height:1.2}
  .title .go{font-size:36px;padding:26px}
  .title .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .title p{font-size:18px;color:var(--soft);font-weight:700}
  .list{flex:1;overflow-y:auto;display:grid;gap:10px;padding:4px 0}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 var(--shadow)}
  .item .em{font-size:44px;line-height:1;width:56px;text-align:center}
  .item .nm{flex:1;font-size:22px;font-weight:900}
  .item .nm small{display:block;font-size:16px;color:var(--soft);font-weight:700}
  .item .btn{min-height:56px;padding:8px 16px;font-size:20px;border-radius:18px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 0}
  .cell{aspect-ratio:1;background:#fff;border-radius:20px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;line-height:1;gap:4px}
  .cell small{font-size:13px;font-weight:900}
  .cell.locked{color:#C9BDB6;background:#F1EBE3}
  .note{font-size:20px;font-weight:900;text-align:center;background:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--shadow);margin-top:8px}
  .h2{font-size:26px;font-weight:900;text-align:center;margin:6px 0}
  .dests{display:flex;gap:6px;justify-content:center;font-size:34px;margin:4px 0}
  .dests .off{opacity:.25;filter:grayscale(1)}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:9}
  #ov.on{display:flex}
  #ov .word{font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 0 8px var(--ink),0 8px 0 var(--shadow);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .conf{position:fixed;font-size:30px;pointer-events:none;animation:fall 1.2s ease-in forwards;z-index:8}
  #fw{position:fixed;inset:0;z-index:7;display:none;background:radial-gradient(ellipse at bottom,#1a1a40 0%,#05051a 100%)}
  #fw.on{display:block}
  #fwword{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;gap:12px;pointer-events:none}
  #fwword.on{display:flex}
  #fwword div{font-size:80px;font-weight:900;color:#fff;text-shadow:0 0 0 10px #ff6f91,0 10px 0 rgba(0,0,0,.4);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  #fwword p{font-size:28px;font-weight:900;color:#fff}
  @keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  @keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(60vh) rotate(360deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-height:640px){.stage{font-size:66px;min-height:110px}.bubble{font-size:19px}.btn{font-size:24px;min-height:72px;padding:12px 8px}.btn b{font-size:38px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div class="word" id="ovw"></div></div>
<canvas id="fw"></canvas>
<div id="fwword"><div>ゴール！</div><p id="fwsub"></p></div>

<script>

const $ = s=>document.querySelector(s);
const app = $('#app');
const rnd = n=>Math.floor(Math.random()*n);
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick = (arr,k,notIdx)=>shuffle(arr.map((v,i)=>i).filter(i=>i!==notIdx)).slice(0,k).map(i=>arr[i]);
const COLORS = ['c1','c2','c3','c4','c5'];
const clean = t=>t.replace(/[「」！？…]/g,' ');

let save = {points:0, owned:[]};
try{ const s=JSON.parse(localStorage.getItem('ehon_save')||'null'); if(s&&typeof s.points==='number') save=s; }catch(e){}
function persist(){ try{ localStorage.setItem('ehon_save', JSON.stringify(save)) }catch(e){} }
const unlockedDests = ()=>UNLOCKS.filter(u=>save.owned.length>=u.need).map(u=>DESTS.find(d=>d.id===u.dest));

function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=0.85; u.pitch=1.15;
    const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja')); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){}
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }

/* =========================================================
   6. ぼうけん エンジン
   Q に シーンを ならべて じゅんばんに すすめる
   ========================================================= */
let A=null, Q=[];
const run=()=>{ const f=Q.shift(); if(f) f(); };
const withStr=()=>{ const p=A.party; if(p.length===1) return hon(p[0].n)+'と ふたりで'; return p.map(c=>hon(c.n)).join('と ')+'と みんなで'; };
const hon=n=>/(さん|ちゃん|くん)$/.test(n)?n:n+'さん';
const fill=t=>t.replace(/\{dest\}/g,A.dest?A.dest.n:'').replace(/\{trans\}/g,A.trans?A.trans.n:'').replace(/\{by\}/g,A.trans?(A.trans.by||A.trans.n+'で'):'').replace(/\{char\}さん/g,A.party[0]?hon(A.party[0].n):'').replace(/\{char\}/g,A.party[0]?A.party[0].n:'').replace(/\{with\}/g,A.party.length?withStr():'');
const addTag=t=>{ if(t) A.tags.push(t); };
const join=c=>{ if(!A.party.find(p=>p.n===c.n)) A.party.push(c); };

function startAdventure(){
  A={dest:null,trans:null,party:[],tags:[],stars:0,acts:0};
  Q=[sDest,sTrans,sTransTell,sTravel,()=>quiz('count'),sArrive,sMeet,sAct,sMore,sEventsSetup,sEnding];
  run();
}

/* --- いきさき・のりもの --- */
function sDest(){ const o=unlockedDests(); choice('🗺️','きょうは どこへ いく？',o.map(d=>({n:d.n,e:d.e,v:d})),d=>{A.dest=d;}); }
function sTrans(){ const pool=A.dest.trans||TRANSPORTS; const o=pick(pool,2); choice(A.dest.e,fill('{dest}まで なにで いく？'),o.map(t=>({n:t.n,e:t.e,v:t})),t=>{A.trans=t;}); }
function sTransTell(){ tell(A.trans.e,fill(A.trans.t)); }

/* --- みちの できごと（じゅうたいは ランダム） --- */
function sTravel(){
  const jam=JAMS[A.trans.kind];
  if(jam && Math.random()<0.7){
    choice('🚧',jam.jam,[{n:'あわてず ゆっくり',e:'🐢',v:'slow'},{n:'いそぐ',e:'⚡',v:'fast'}],v=>{
      const enc=jam[v][rnd(jam[v].length)];
      A.enc=enc;
      Q.unshift(()=>tell(v==='slow'?'🐢':'⚡',v==='slow'?jam.slowT:jam.fastT),()=>tell(enc.e,fill(enc.t)));
      if(enc.join) Q.splice(2,0,()=>choice(enc.e,hon(enc.n)+'が 「いっしょに いく？」',[{n:'はい',e:'😊',v:true},{n:'ばいばい',e:'👋',v:false}],ok=>{ if(ok) join(enc); Q.unshift(()=>tell(enc.e,ok?hon(enc.n)+'が なかまに なった！':hon(enc.n)+'に てを ふって ばいばい。')); }));
    });
  }else if(A.trans.kind==='walk' || A.trans.kind==='sky' || !jam){
    const pool=A.trans.kind==='sky'?SKY_EVENTS:WALK_EVENTS;
    const ev=pool[rnd(pool.length)];
    choice(A.trans.kind==='sky'?'🎈':'🛤️',fill(ev.t),ev.c.map(c=>({n:fill(c.n),e:c.e,v:c})),c=>{ Q.unshift(()=>tell(c.e,fill(c.t))); });
  }else{
    tell(A.trans.e,'みちは すいすい。 もうすぐ つくよ！');
  }
}

/* --- とうちゃく・なかま --- */
function sArrive(){ tell(A.dest.e,fill(A.dest.arrive)); }
function sMeet(){
  const o=pick(A.dest.chars,2);
  choice(A.dest.e,'だれかが いるよ。 だれに あいたい？',o.map(c=>({n:c.n,e:c.e,v:c})),c=>{ A.party.unshift(c); Q.unshift(()=>tell(c.e,hon(c.n)+' '+c.l)); });
}
function sAct(){
  const o=pick(A.dest.acts,2);
  choice(A.party[0].e,fill('{char}さんと なにを する？'),o.map(a=>({n:a.n,e:a.e,v:a})),a=>{ addTag(a.tag); A.acts++; Q.unshift(()=>tell(a.e,fill(a.t))); });
}
/* もうひとり くる？（なかまは さいだい 3にん） */
function sMore(){
  if(A.party.length>=3){ return run(); }
  const used=A.party.map(p=>p.n);
  const pool=[...A.dest.chars,...GUESTS].filter(c=>!used.includes(c.n));
  const g=pool[rnd(pool.length)];
  choice(g.e,hon(g.n)+'が きたよ。 '+g.l+' どうする？',[{n:'いっしょに あそぶ',e:'🤝',v:true},{n:'ばいばい',e:'👋',v:false}],ok=>{
    if(ok){ join(g); Q.unshift(()=>tell(g.e,hon(g.n)+'も なかまに なった！ '+A.party.length+'にんに なったよ。'));
      if(A.acts<2) Q.splice(1,0,sAct);
      if(A.party.length<3 && Math.random()<0.5) Q.splice(A.acts<2?2:1,0,sMore);
    }else{ Q.unshift(()=>tell('👋',hon(g.n)+'に てを ふって ばいばい。 「またね！」')); }
  });
}

/* --- できごと 3つ（クイズを あいだに はさむ） --- */
function sEventsSetup(){
  const ate=A.tags.includes('gohan');
  const commons=COMMON_EVENTS.filter(ev=>!(ate && ev.c.every(c=>c.tag==='gohan')));
  const evs=[...pick(A.dest.events,2),...pick(commons,1)];
  const ordered=shuffle(evs);
  const quizzes=shuffle(['hira','kata']).concat(['alpha']);
  const seq=[];
  ordered.forEach((ev,i)=>{ seq.push(()=>sEvent(ev)); seq.push(()=>quiz(quizzes[i])); });
  Q.unshift(...seq); run();
}
function sEvent(ev){
  choice('❗',fill(ev.t),ev.c.map(c=>({n:c.n,e:c.e,v:c})),c=>{ addTag(c.tag); Q.unshift(()=>tell(c.e,fill(c.t))); });
}

/* --- エンディング（いちばん おおい tag で きまる） --- */
function sEnding(){
  const cnt={}; A.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  const max=Math.max(...Object.values(cnt));
  const tops=Object.keys(cnt).filter(t=>cnt[t]===max);
  const key=tops[rnd(tops.length)]||'asobi';
  const en=ENDINGS[key];
  Q.unshift(()=>tell(A.party.map(p=>p.e).join(''),fill(en.t)+' '+fill(A.dest.goal)+'おしまい！'),goal);
  A.endEmoji=en.e; run();
}

/* =========================================================
   7. がめんの ぶひん
   ========================================================= */
function header(){
  return `<div class="top"><button class="icon" id="homeBtn" aria-label="はじめに もどる">🏠</button>
    <div class="party">${A&&A.party.length?A.party.map(p=>p.e).join(' '):''}</div>
    <div class="pts">⭐ <span>${A?A.stars:0}</span></div></div>`;
}
function bindCommon(readText){ $('#homeBtn').onclick=()=>{ try{speechSynthesis.cancel()}catch(e){}; showTitle(); }; const s=$('.say'); if(s) s.onclick=()=>speak(readText); }

function choice(emoji,text,opts,onPick){
  app.innerHTML=header()+`<div class="stage">${emoji}</div>
    <div class="bubble"><div class="txt">${text}</div><button class="say">🔊</button></div>
    <div class="choices ${opts.length>2?'three':'two'}">${opts.map((o,i)=>`<button class="btn ${COLORS[(i+Q.length)%5]} ${opts.length>2?'sm':''}" data-i="${i}"><b>${o.e}</b>${o.n}</button>`).join('')}</div>`;
  bindCommon(clean(text)); speak(clean(text)+' '+opts.map(o=>o.n).join('？ ')+'？');
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const o=opts[b.dataset.i]; speak(o.n); onPick(o.v); setTimeout(run,450); });
}
function tell(emoji,text){
  app.innerHTML=header()+`<div class="stage">${emoji}</div>
    <div class="bubble"><div class="txt">${text}</div><button class="say">🔊</button></div>
    <div class="choices"><button class="btn c1" id="nx">つぎへ <small>▶</small></button></div>`;
  bindCommon(clean(text)); speak(clean(text)); $('#nx').onclick=run;
}
function quiz(type){
  let qz;
  if(type==='count'){
    const n=1+rnd(10), ce=A.dest.ce, others=pick(Array.from({length:10},(_,i)=>i+1),2,n-1), lead='とちゅうで これを みつけた！';
    qz={stage:Array.from({length:n},()=>`<span>${ce}</span>`).join(''),cls:'count',q:lead+'<br>いくつ かな？',read:clean(lead)+' いくつ かな？',ans:String(n),ansRead:NUM_YOMI[n],hint:NUM_YOMI[n],opts:shuffle([n,...others]).map(v=>({l:String(v),v:String(v),big:true}))};
  }else if(type==='alpha'){
    const i=rnd(26),L=ALPHA[i],others=pick(ALPHA,2,i), lead='もじの かんばんが あるよ。';
    qz={stage:`<span style="font-size:72px">「${ALPHA_YOMI[L]}」</span>`,cls:'',q:lead+`<br>「${ALPHA_YOMI[L]}」は どれ？`,read:clean(lead)+' '+ALPHA_YOMI[L]+' は どれ？',ans:L,ansRead:ALPHA_YOMI[L],hint:ALPHA_YOMI[L],opts:shuffle([L,...others]).map(v=>({l:v,v:v,big:true}))};
  }else{
    const pool=type==='hira'?HIRA:KATA, i=rnd(pool.length),[w,e]=pool[i],others=pick(pool,2,i), lead=fill('{char}さんが えを みせてくれたよ。');
    qz={stage:e,cls:'',q:lead+`<br>これは なに？`,read:clean(lead)+' これは なに？',ans:w,ansRead:w,hint:w,opts:shuffle([[w,e],...others]).map(o=>({l:o[0],v:o[0],big:o[0].length<=2}))};
  }
  app.innerHTML=header()+`<div class="stage ${qz.cls}">${qz.stage}</div>
    <div class="bubble"><div class="txt">${qz.q}</div><button class="say">🔊</button></div>
    <div class="choices three">${qz.opts.map((o,i)=>`<button class="btn ${COLORS[i%5]} ${o.big?'big':''}" data-v="${o.v}">${o.l}</button>`).join('')}</div>`;
  bindCommon(qz.read); speak(qz.read);
  let locked=false;
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(locked) return;
    if(b.dataset.v===qz.ans){ locked=true; b.classList.add('right'); A.stars++; $('.pts').innerHTML='⭐ <span>'+A.stars+'</span>'; showWord('せいかい！'); burst(14); speak('せいかい！ '+qz.ansRead+'！'); setTimeout(run,1300); }
    else{ b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); speak('もういちど。 ヒント、 '+qz.hint+'！ '+qz.hint+' は どれかな？'); }
  });
}

/* ゴール：はなび → ポイント */
function goal(){
  const bonus=2, got=A.stars+bonus;
  save.points+=got; persist();
  const text=fill('{with} ゴール！');
  app.innerHTML=header()+`<div class="stage">${A.endEmoji}</div>
    <div class="bubble"><div class="txt">${text}<br>⭐ ${got} ポイント もらったよ！</div><button class="say">🔊</button></div>
    <div class="choices two"><button class="btn c2" id="toShop"><b>🍦</b>アイスやさん</button><button class="btn c3" id="again"><b>📖</b>もういちど</button></div>`;
  bindCommon(clean(text)); $('#toShop').onclick=showShop; $('#again').onclick=startAdventure;
  fireworks(got,()=>speak(clean(text)+' ほしが '+got+'ポイント もらえたよ！'));
}

/* =========================================================
   8. アイスやさん・ずかん
   ========================================================= */
function showShop(){
  A=null;
  app.innerHTML=`<div class="top"><button class="icon" id="homeBtn">🏠</button><div class="pts">⭐ <span>${save.points}</span></div></div>
    <div class="h2">🍦 アイスやさん</div><div class="list">${ICES.map((ic,i)=>{ const own=save.owned.includes(ic.id);
      return `<div class="item"><div class="em">${ic.e}</div><div class="nm">${ic.n}<small>⭐ ${ic.p} ポイント</small></div>${own?`<div class="btn c3" style="min-height:56px;font-size:18px">もってる</div>`:`<button class="btn ${COLORS[i%5]}" data-id="${ic.id}" ${save.points>=ic.p?'':'disabled'}>こうかん</button>`}</div>`;}).join('')}</div>`;
  $('#homeBtn').onclick=showTitle;
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const ic=ICES.find(x=>x.id===b.dataset.id); if(save.points<ic.p||save.owned.includes(ic.id)) return;
    const before=unlockedDests().length; save.points-=ic.p; save.owned.push(ic.id); persist();
    burst(16); showWord(ic.e);
    const nd=unlockedDests().length>before?unlockedDests().slice(-1)[0]:null;
    speak(ic.n+'アイス、 ゲット！'+(nd?' あたらしい おはなし、 '+nd.n+'が ふえたよ！':''));
    setTimeout(()=>{ nd?showUnlock(nd):showShop(); },900);
  });
}
function showUnlock(d){
  app.innerHTML=`<div class="title"><h1><span>${d.e}</span>あたらしい おはなし！</h1><p style="font-size:24px;color:var(--ink)">「${d.n}」へ いけるように なったよ</p>
    <button class="btn c3 go" id="go">ぼうけんに いく</button><button class="btn c2" id="back">アイスやさんに もどる</button></div>`;
  burst(20); $('#go').onclick=startAdventure; $('#back').onclick=showShop;
}
function showZukan(){
  A=null; const n=save.owned.length, nu=UNLOCKS.find(u=>u.need>n), nd=nu?DESTS.find(d=>d.id===nu.dest):null;
  app.innerHTML=`<div class="top"><button class="icon" id="homeBtn">🏠</button><div class="pts">🍦 ${n} / ${ICES.length}</div></div>
    <div class="h2">📔 アイスずかん</div>
    <div class="grid">${ICES.map(ic=>save.owned.includes(ic.id)?`<div class="cell">${ic.e}<small>${ic.n}</small></div>`:`<div class="cell locked">❓</div>`).join('')}</div>
    <div class="note">${nd?`あと <b style="font-size:30px">${nu.need-n}</b> こ あつめると<br>${nd.e} ${nd.n} へ いけるよ`:'ぜんぶ あつめた！ すごい！ 🎉'}</div>
    <div class="dests" style="margin-top:12px">${DESTS.map(d=>`<span class="${unlockedDests().includes(d)?'':'off'}">${d.e}</span>`).join('')}</div>`;
  $('#homeBtn').onclick=showTitle;
  speak(nd?'あと '+(nu.need-n)+'こ あつめると、 '+nd.n+' へ いけるよ':'ぜんぶ あつめた！ すごい！');
}

/* =========================================================
   9. えんしゅつ
   ========================================================= */
function showWord(w){ const ov=$('#ov'); $('#ovw').textContent=w; ov.classList.add('on'); setTimeout(()=>ov.classList.remove('on'),1000); }
function burst(n){ const em=['🎉','⭐','🌟','✨','🎈','💖'];
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='conf'; s.textContent=em[rnd(em.length)]; s.style.left=rnd(100)+'vw'; s.style.top=(-10+rnd(30))+'vh'; s.style.animationDelay=(rnd(400)/1000)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),1800); } }
function fireworks(pts,onDone){
  const cv=$('#fw'), ctx=cv.getContext('2d'), W=cv.width=innerWidth, H=cv.height=innerHeight;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  cv.classList.add('on'); const word=$('#fwword'); $('#fwsub').textContent='⭐ '+pts+' ポイント';
  let parts=[], t0=performance.now(), shots=0; const colors=['#ff6f91','#ffd86b','#a6e3a1','#9bd4ff','#cdb4f5','#fff'];
  function shoot(){ const x=W*(0.2+Math.random()*0.6), y=H*(0.15+Math.random()*0.4), c=colors[rnd(colors.length)];
    for(let i=0;i<70;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c}); } }
  function frame(now){ const el=now-t0; if(shots<8&&el>shots*450){shoot();shots++;}
    ctx.fillStyle='rgba(5,5,26,.25)'; ctx.fillRect(0,0,W,H);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.vx*=0.98;p.life-=0.012;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();});
    ctx.globalAlpha=1; parts=parts.filter(p=>p.life>0); if(el>800) word.classList.add('on');
    if(el<4200&&!reduce) requestAnimationFrame(frame); else end(); }
  function end(){ cv.classList.remove('on'); word.classList.remove('on'); ctx.clearRect(0,0,W,H); burst(20); onDone&&onDone(); }
  speak('ゴール！ はなびだよ！'); if(reduce){ word.classList.add('on'); setTimeout(end,1500); } else requestAnimationFrame(frame);
}

showTitle();
</script>
