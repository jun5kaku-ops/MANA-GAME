<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#DDF3FF">
<title>えほん ぼうけん</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFF8E7;--sky:#DDF3FF;--ink:#3B2F2F;--soft:#8A7B74;--sun:#FFD86B;--berry:#FFA3C1;--leaf:#A6E3A1;--pond:#9BD4FF;--grape:#CDB4F5;--bubble:#FFFFFF;--shadow:rgba(70,40,20,.18)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c","BIZ UDPGothic",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--paper) 55%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #app{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:10px 14px 14px;overflow:hidden}

  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
  .icon{font-size:26px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 var(--shadow)}
  .party{flex:1;font-size:26px;text-align:center;line-height:1}
  .pts{font-size:22px;font-weight:900;background:#fff;border-radius:22px;padding:6px 14px;box-shadow:0 3px 0 var(--shadow)}
  .pts span{animation:pop .4s cubic-bezier(.2,1.6,.4,1);display:inline-block}

  /* scene picture */
  .stage{flex:0 0 auto;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:8px 0 6px}
  .stage .main{font-size:84px;line-height:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;text-align:center}
  .stage .crew{font-size:40px;line-height:1;display:flex;gap:6px;justify-content:center}
  .stage .crew i{font-style:normal;animation:bob 1.6s ease-in-out infinite}
  .stage .crew i:nth-child(2){animation-delay:.25s}
  .stage .crew i:nth-child(3){animation-delay:.5s}
  .stage.count .main{font-size:50px;gap:10px}
  .stage.big .main{font-size:104px}

  .bubble{position:relative;background:var(--bubble);border-radius:26px;padding:18px 20px;font-size:22px;font-weight:700;line-height:1.55;box-shadow:0 5px 0 var(--shadow);display:flex;align-items:center;gap:10px}
  .bubble:before{content:"";position:absolute;top:-14px;left:44px;border:9px solid transparent;border-bottom-color:var(--bubble);border-top:0}
  .bubble .txt{flex:1}
  .bubble .say{font-size:28px;background:none;border:0;line-height:1}

  .choices{margin-top:auto;padding-top:12px;display:grid;gap:12px}
  .drill+.choices{margin-top:0}
  .choices.two{grid-template-columns:1fr 1fr}
  .choices.three{grid-template-columns:1fr 1fr 1fr}
  .btn{border:0;border-radius:24px;padding:16px 10px;font-family:inherit;font-weight:900;font-size:26px;line-height:1.2;color:var(--ink);background:var(--sun);box-shadow:0 7px 0 var(--shadow);transition:transform .08s;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .btn b{font-size:44px;line-height:1}
  .btn small{font-size:17px;font-weight:700;color:var(--soft)}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
  .btn:disabled{opacity:.4;box-shadow:0 3px 0 var(--shadow)}
  .btn.c1{background:var(--sun)}.btn.c2{background:var(--berry)}.btn.c3{background:var(--leaf)}.btn.c4{background:var(--pond)}.btn.c5{background:var(--grape)}
  .btn.big{font-size:42px}
  .btn.sm{font-size:19px;min-height:72px;padding:10px 6px}.btn.sm b{font-size:38px}
  .choices.kana{gap:8px}
  .btn.kchip{min-height:58px;padding:6px 2px;font-size:30px;border-radius:18px;box-shadow:0 5px 0 var(--shadow)}
  .btn.kchip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  .btn.wrong{animation:wiggle .5s;opacity:.55}
  .btn.right{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

  .title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
  .title h1{font-size:38px;font-weight:900;letter-spacing:.04em;line-height:1.3}
  .title h1 span{display:block;font-size:64px;line-height:1.2}
  .title .go{font-size:36px;padding:24px}
  .title .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .title p{font-size:17px;color:var(--soft);font-weight:700}

  /* map */
  .map{position:relative;flex:1;margin:6px 0;border-radius:26px;overflow:hidden;
       background:linear-gradient(180deg,#BFE9FF 0%,#DFF6D8 45%,#FFF0C9 100%);box-shadow:0 5px 0 var(--shadow)}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .map .mapbg{z-index:0}
  .map .node{z-index:2}
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font-family:inherit}
  .node .bub{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--shadow);display:flex;align-items:center;justify-content:center;font-size:36px;transition:transform .08s}
  .node:active .bub{transform:translateY(4px)}
  .node .lb{font-size:14px;font-weight:900;background:rgba(255,255,255,.85);border-radius:10px;padding:1px 7px;white-space:nowrap}
  .node.lock .bub{background:#EFE7DE;color:#B9AAA0;font-size:30px}
  .node.lock .lb{color:var(--soft)}
  @media (max-height:700px){.node .bub{width:54px;height:54px;font-size:30px}.node .lb{font-size:12px}}

  .list{flex:1;overflow-y:auto;display:grid;gap:10px;padding:4px 0}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 var(--shadow)}
  .item .em{font-size:40px;line-height:1;width:52px;text-align:center}
  .item .nm{flex:1;font-size:21px;font-weight:900}
  .item .nm small{display:block;font-size:15px;color:var(--soft);font-weight:700}
  .item .btn{min-height:52px;padding:8px 14px;font-size:19px;border-radius:18px}
  .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:6px 2px;align-content:start}
  .cell{aspect-ratio:1;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1;gap:3px;padding:2px}
  .cell small{font-size:11px;font-weight:900;text-align:center;line-height:1.1}
  .cell.locked{color:#C9BDB6;background:#F1EBE3}
  .note{font-size:19px;font-weight:900;text-align:center;background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--shadow);margin-top:6px}
  .h2{font-size:25px;font-weight:900;text-align:center;margin:4px 0}
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 12px}
  .seg button{border:0;border-radius:18px;padding:14px 4px;font-family:inherit;font-size:19px;font-weight:900;background:#fff;color:var(--soft);box-shadow:0 4px 0 var(--shadow)}
  .seg button.on{background:var(--sun);color:var(--ink)}
  .lbl{font-size:19px;font-weight:900;margin-top:6px}

  /* ドリル */
  .drill{background:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 4px 0 var(--shadow);margin-top:auto;text-align:center}
  .drill .qq{font-size:19px;font-weight:900;line-height:1.4}
  .drill .vis{font-size:44px;line-height:1.1;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin-top:4px}
  .drill .vis.small{font-size:34px}
  .drill .eq{font-size:30px;font-weight:900}
  .drill .cbox{width:96px;height:96px;border-radius:24px;margin:6px auto 2px;box-shadow:0 5px 0 var(--shadow);border:5px solid #fff}
  .drill .slots{display:flex;gap:8px;justify-content:center;margin-top:6px}
  .drill .slot{width:46px;height:52px;border-radius:14px;background:#F3ECE3;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--ink)}
  .drill .slot.fill{background:var(--leaf);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  .stage.mini .main{font-size:54px}
  .stage.mini{min-height:96px;margin:2px 0 6px}
  .stage.mini .crew{font-size:30px}
  .bubble.mini{font-size:19px;padding:12px 16px}

  /* エンディング えんしゅつ */
  .fin{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;overflow:hidden}
  .fin.on{display:flex}
  .fin .fc{font-size:60px;line-height:1}
  .fin .fcrew{font-size:50px;line-height:1}
  .fin .fw{font-size:54px;font-weight:900;color:#fff;text-shadow:0 0 0 9px rgba(0,0,0,.45),0 8px 0 rgba(0,0,0,.25);animation:pop .6s cubic-bezier(.2,1.6,.4,1);text-align:center;padding:0 16px}
  .fin .fs{font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .fin .tap{position:absolute;bottom:34px;font-size:17px;font-weight:900;color:#fff;opacity:.85}
  .fin.bg-night{background:radial-gradient(ellipse at bottom,#26265e 0%,#05051a 100%)}
  .fin.bg-warm{background:linear-gradient(180deg,#FFD6A5 0%,#FF9E80 60%,#C96F4A 100%)}
  .fin.bg-sky{background:linear-gradient(180deg,#7EC8F5 0%,#CFEFFF 55%,#F6FFE8 100%)}
  .fin.bg-sunset{background:linear-gradient(180deg,#3B4A8C 0%,#FF8C69 55%,#FFD86B 100%)}
  .fin.bg-aurora{background:linear-gradient(180deg,#07103a 0%,#123b5c 50%,#04061c 100%)}
  .fin.bg-aurora:before{content:"";position:absolute;inset:-20% -30%;background:linear-gradient(115deg,rgba(120,255,190,0) 20%,rgba(120,255,190,.55) 38%,rgba(180,140,255,.5) 55%,rgba(120,255,190,0) 75%);filter:blur(14px);animation:aur 6s ease-in-out infinite}
  .fin.bg-festival{background:linear-gradient(180deg,#2B1B4A 0%,#7A3B7E 60%,#E0655B 100%)}
  .fin.bg-sea{background:linear-gradient(180deg,#63C7F0 0%,#2E86AB 60%,#123E5C 100%)}
  .fp{position:absolute;pointer-events:none;line-height:1}
  @keyframes aur{0%,100%{transform:translateX(-8%) skewY(-4deg)}50%{transform:translateX(8%) skewY(4deg)}}
  @keyframes fpUp{0%{transform:translateY(20vh) scale(.7);opacity:0}15%{opacity:1}100%{transform:translateY(-95vh) scale(1.1);opacity:0}}
  @keyframes fpDown{0%{transform:translateY(-20vh) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(95vh) rotate(200deg);opacity:0}}
  @keyframes fpAcross{0%{transform:translateX(-20vw);opacity:0}12%{opacity:1}100%{transform:translateX(115vw);opacity:0}}
  /* はいけい（SVGの けしき） */
  #bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
  #bg .sky{position:absolute;inset:0}
  #bg .land{position:absolute;left:0;bottom:0;width:100%;height:38vh;display:block}
  #bg .rsun{position:absolute;border-radius:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 0 24px rgba(255,180,120,.5))}
  #bg .rsun.st{-webkit-mask:repeating-linear-gradient(180deg,#000 0 62%,transparent 62% 66%,#000 66% 74%,transparent 74% 79%,#000 79% 86%,transparent 86% 90%,#000 90% 100%);
    mask:repeating-linear-gradient(180deg,#000 0 62%,transparent 62% 66%,#000 66% 74%,transparent 74% 79%,#000 79% 86%,transparent 86% 90%,#000 90% 100%)}
  #bg .cloud{position:absolute;aspect-ratio:2.4/1;background:#fff;opacity:.85;border-radius:999px;
    box-shadow:0 -0.8vw 0 -0.1vw #fff inset,0 0 0 3px rgba(43,32,24,.12)}
  #bg .stars{position:absolute;inset:0;background:
    radial-gradient(1.4px 1.4px at 12% 8%,#fff,transparent),radial-gradient(1.6px 1.6px at 28% 18%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 44% 6%,#fff,transparent),radial-gradient(1.8px 1.8px at 62% 14%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 78% 5%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 20%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 18% 30%,#fff,transparent),radial-gradient(1.4px 1.4px at 54% 26%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 70% 34%,#fff,transparent),radial-gradient(1.2px 1.2px at 36% 38%,#fff,transparent);opacity:.9}
  #bg .aurora{position:absolute;left:-20%;right:-20%;top:6%;height:34%;
    background:linear-gradient(110deg,rgba(111,227,200,0) 22%,rgba(111,227,200,.5) 40%,rgba(205,180,245,.45) 58%,rgba(111,227,200,0) 76%);
    filter:blur(12px);animation:aur 7s ease-in-out infinite}
  #bg .rgrid{position:absolute;left:0;right:0;bottom:34vh;height:14vh;opacity:.35;
    background:repeating-linear-gradient(90deg,transparent 0 38px,var(--gc) 38px 39px),repeating-linear-gradient(180deg,transparent 0 22px,var(--gc) 22px 23px)}
  #bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,248,231,0) 40%,rgba(255,248,231,.22) 76%,rgba(255,248,231,.45) 100%)}
  @keyframes aur{0%,100%{transform:translateX(-6%)}50%{transform:translateX(6%)}}
  .logo{display:block;width:100%;max-width:340px;margin:0 auto}
  .title .row .btn{font-size:15px;line-height:1.15}
  #scan{position:fixed;inset:0;z-index:20;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(43,32,24,.045) 0 1px,transparent 1px 3px),
      radial-gradient(rgba(43,32,24,.05) 1px,transparent 1.4px) 0 0/6px 6px;mix-blend-mode:multiply}
  .bubble,.drill,.item,.cell,.note,.map,.pts,.icon,.seg button,.btn{border:3px solid var(--ink)}
  .bubble{background:linear-gradient(180deg,#fff 0%,#FFF6E4 100%)}
  .bubble:before{border-bottom-color:var(--ink);top:-17px}
  .bubble:after{content:"";position:absolute;top:-13px;left:47px;border:8px solid transparent;border-bottom-color:#fff;border-top:0}
  .btn{background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
  .stage .main{filter:drop-shadow(0 4px 0 rgba(43,32,24,.18))}
  .ca{display:block;filter:drop-shadow(0 3px 0 rgba(43,32,24,.22))}
  .btn .ca{margin-bottom:2px}
  .stage .crew i{display:block}
  .title h1{filter:drop-shadow(0 4px 0 rgba(43,32,24,.25))}
  .h2{-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;color:#FFD86B;filter:drop-shadow(0 3px 0 rgba(43,32,24,.25))}
  .node .bub{border:3px solid var(--ink);background:linear-gradient(180deg,#fff,#FFE9C4)}
  .node .lb{border:2px solid var(--ink)}
  .cell{background:linear-gradient(180deg,#fff,#FFF6E4)}
  #fw{z-index:10}
  /* なぞりがき */
  .trwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0;margin-top:auto}
  .trq{font-size:19px;font-weight:900;text-align:center;margin:8px 0 2px}
  #trBtns .btn{font-size:14px;white-space:nowrap;min-height:64px;padding:8px 2px}
  #trBtns .btn b{font-size:26px}
  #trsvg{width:min(100%,42vh);max-width:320px;aspect-ratio:1;touch-action:none;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--shadow)}
  .trbg{fill:#fff}
  .trgrid{stroke:#E4DAC8;stroke-width:.8;stroke-dasharray:3 3;fill:none}
  .trguide{stroke:#EDE3D2;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .trcur{stroke:#BFB2A8;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.5 7}
  .trdone{stroke:#6FBF5A;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .trink{stroke:#FF8FAB;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
  .trmeas{fill:none;stroke:none}
  .trstart{fill:#FF8FAB;stroke:var(--ink);stroke-width:1.6}
  .trstart.pulse{animation:tpulse .6s ease-out 2}
  .trnum{font-size:7px;font-weight:900;fill:#fff}
  .trdot{fill:#FFD22E;stroke:var(--ink);stroke-width:1.6}
  @keyframes tpulse{0%{r:6}50%{r:11}100%{r:6}}
  /* 50おんひょう */
  .kchart{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 2px;align-content:start}
  .kc{font-family:inherit;font-size:24px;font-weight:900;color:var(--ink);background:#fff;border:3px solid var(--ink);
    border-radius:14px;min-height:48px;box-shadow:0 4px 0 var(--shadow);position:relative}
  .kc.easy{background:#DFF6D8}
  .kc.got:after{content:"⭐";position:absolute;top:-6px;right:-4px;font-size:15px}
  .kc.gap{background:none;border:0;box-shadow:none}
  .kc:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  #ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:9}
  #ov.on{display:flex}
  #ov .word{font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 0 8px var(--ink),0 8px 0 var(--shadow);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .conf{position:fixed;font-size:30px;pointer-events:none;animation:fall 1.2s ease-in forwards;z-index:8}
  #fw{position:fixed;inset:0;z-index:10;display:none;background:radial-gradient(ellipse at bottom,#1a1a40 0%,#05051a 100%)}
  #fw.on{display:block}
  #fwword{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;gap:10px;pointer-events:none}
  #fwword.on{display:flex}
  #fwword .crew{font-size:56px}
  #fwword div.t{font-size:72px;font-weight:900;color:#fff;text-shadow:0 0 0 10px #ff6f91,0 10px 0 rgba(0,0,0,.4);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  #fwword p{font-size:26px;font-weight:900;color:#fff}

  @keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes wiggle{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  @keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(60vh) rotate(360deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-height:660px){.stage .main{font-size:64px}.stage{min-height:110px}.bubble{font-size:19px}.btn{font-size:23px;min-height:70px;padding:10px 8px}.btn b{font-size:36px}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="scan"></div>
<div id="ov"><div class="word" id="ovw"></div></div>
<canvas id="fw"></canvas>
<div id="fin" class="fin"><div class="fcrew" id="fincrew"></div><div class="fc" id="fincenter"></div><div class="fw" id="finword"></div><div class="fs" id="finsub"></div><div class="tap">タップ すると つづくよ</div></div>

<script src="art.js"></script>
<script src="kana.js"></script>
<script>
/* =========================================================
   1. がくしゅう データ

const PRE=['',' ','　','「','。','、','！','？'];
const POST=['','が','を','に','は','で','と','も','の',' ','　','。','、','！','？'];
function findObj(text){
  const t=text.replace(/<[^>]*>/g,'');
  const names=(A&&A.party?A.party:[]).map(p=>p.n);
  for(const o of OBJS){
    if(names.some(n=>n.includes(o[0]))) continue;
    let i=-1;
    while((i=t.indexOf(o[0],i+1))>=0){
      const pre=i===0?'':t[i-1], post=t[i+o[0].length]||'';
      if(PRE.includes(pre)&&POST.includes(post)) return {w:o[0],e:o[1],shape:o[2],fl:o[3]||''};
    }
  }
  return null;
}

const clean=t=>t.replace(/<[^>]*>/g,' ')
  .replace(/[ 　]*「[ 　]*/g,'、 ').replace(/[」…]/g,' ')
  .replace(/([。！？、])\s*、/g,'$1 ')
  .replace(/[ 　]{2,}/g,' ').replace(/^[、 　]+/,'').trim();
/* じょし の「は」「へ」は wa / e で よませる（ことばの おわりに ある は・へ だけ）*/
function yomi(t){
  return String(t).split(/([ 　。、！？\n])/).map(tok=>{
    if(tok.length>1){
      if(tok.endsWith('は')) return tok.slice(0,-1)+'わ';
      if(tok.endsWith('へ')) return tok.slice(0,-1)+'え';
    }
    return tok;
  }).join('');
}

/* --- よみあげ（あいだを あける） --- */
const RATES=[0.62,0.75,0.9], PITCHES=[0.9,1.15,1.45];
let sq=[], sqTimer=null;
function jaVoices(){ try{ return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ja')) }catch(e){ return [] } }
function stopSpeak(){ if(sqTimer) clearTimeout(sqTimer); sqTimer=null; sq=[]; try{ speechSynthesis.cancel() }catch(e){} }
function speak(...parts){ if(!('speechSynthesis' in window)) return; stopSpeak();
  sq=parts.flat().map(p=>typeof p==='string'?yomi(p):p); playNext(); }
function playNext(){
  if(!sq.length) return;
  const p=sq.shift();
  if(typeof p==='number'){ sqTimer=setTimeout(playNext,p); return; }
  if(!p){ playNext(); return; }
  try{
    const u=new SpeechSynthesisUtterance(p);
    u.lang='ja-JP'; u.rate=RATES[save.rate-1]||0.75; u.pitch=PITCHES[save.pitch-1]||1.15;
    const vs=jaVoices(); const v=vs.find(x=>x.name===save.voice)||vs[0]; if(v) u.voice=v;
    u.onend=()=>{ sqTimer=setTimeout(playNext,120) };
    u.onerror=()=>{ sqTimer=setTimeout(playNext,120) };
    speechSynthesis.speak(u);
  }catch(e){ playNext(); }
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>jaVoices(); }

let A=null, Q=[];
const run=()=>{ const f=Q.shift(); if(f) f(); };
const withStr=()=>{ const p=A.party; if(p.length===1) return hon(p[0].n)+'と ふたりで'; return p.map(c=>hon(c.n)).join('と ')+'と みんなで'; };
const whoStr=()=>A.party.map(c=>hon(c.n)).join('と ');
const crewStr=()=>A.party.length>1?'みんな':(A.party[0]?hon(A.party[0].n):'');
const fill=t=>t.replace(/\{dest\}/g,A.dest?A.dest.n:'')
  .replace(/\{who\}/g,A.party.length?whoStr():'')
  .replace(/\{crew\}/g,A.party.length?crewStr():'')
  .replace(/\{by\}/g,A.trans?(A.trans.by||A.trans.n+'で'):'')
  .replace(/\{char\}さん/g,A.party[0]?hon(A.party[0].n):'')
  .replace(/\{char\}/g,A.party[0]?A.party[0].n:'')
  .replace(/\{with\}/g,A.party.length?withStr():'');
const addTag=t=>{ if(t) A.tags.push(t); };
const join=c=>{ if(!A.party.find(p=>p.n===c.n)) A.party.push(c); meetChar(c); };

function startAdventure(stage){
  setBG(stage.id);
  A={dest:stage,trans:null,party:[],tags:[],stars:0,acts:0};
  drillBag=[];
  Q=[sTrans,sTransTell,sTravel,sMeet,sAct,sMore,sEventsSetup,sEnding];
  run();
}
function sTrans(){ const pool=A.dest.trans||TRANSPORTS; const o=pick(pool,2); choice(A.dest.e,fill('{dest}まで なにで いく？'),o.map(t=>({n:t.n,e:t.e,v:t})),t=>{A.trans=t;}); }
function sTransTell(){ tell(A.trans.e,fill(A.trans.t)); }

function sTravel(){
  const jam=JAMS[A.trans.kind];
  const roll=Math.random();
  if(jam && roll<0.35){
    choice('🚧',jam.jam,[{n:'あわてず ゆっくり',e:'🐢',v:'slow'},{n:'いそぐ',e:'⚡',v:'fast'}],v=>{
      const enc=jam[v][rnd(jam[v].length)];
      Q.unshift(()=>tell(v==='slow'?'🐢':'⚡',v==='slow'?jam.slowT:jam.fastT),()=>tell(art(enc.n,96),fill(enc.t)));
      if(enc.join) Q.splice(2,0,()=>choice(art(enc.n,84),hon(enc.n)+'が 「いっしょに いく？」',[{n:'はい',e:'😊',v:true},{n:'ばいばい',e:'👋',v:false}],ok=>{
        if(ok) join(enc);
        Q.unshift(()=>tell(art(enc.n,96),ok?hon(enc.n)+'が なかまに なった！':hon(enc.n)+'に てを ふって ばいばい。'));
      }));
    });
    return;
  }
  const k=A.trans.kind;
  const pool = k==='sky'?SKY_EVENTS : k==='space'?SPACE_EVENTS : k==='rail'?RAIL_EVENTS :
               k==='road'||k==='candy'?ROAD_EVENTS : WALK_EVENTS;
  const ev=pool[rnd(pool.length)];
  choice(A.trans.e,fill(ev.t),ev.c.map(c=>({n:fill(c.n),e:c.e,v:c})),c=>{ Q.unshift(()=>tell(c.e,fill(c.t))); });
}

function sMeet(){
  const o=pick(A.dest.chars,2);
  choice(A.dest.e,fill(A.dest.arrive)+' <br>だれに あいたい？',o.map(c=>({n:c.n,e:c.e,art:art(c.n,62),v:c})),c=>{ A.party.unshift(c); meetChar(c); Q.unshift(()=>tell(art(c.n,96),hon(c.n)+' '+c.l)); });
}
function sAct(){
  const o=pick(A.dest.acts,2);
  choice(A.party.map(p=>art(p.n,68)).join(''),fill('{who}と なにを する？'),o.map(a=>({n:fill(a.n),e:a.e,v:a})),a=>{ addTag(a.tag); A.acts++; Q.unshift(()=>tell(a.e,fill(a.t),a.tag==='gohan'?'food':null)); });
}
function sMore(){
  if(A.party.length>=3) return run();
  const used=A.party.map(p=>p.n);
  const pool=[...A.dest.chars,...GUESTS].filter(c=>!used.includes(c.n));
  const g=pool[rnd(pool.length)];
  choice(art(g.n,84),hon(g.n)+'が きたよ。 '+g.l+' どうする？',[{n:'いっしょに あそぶ',e:'🤝',v:true},{n:'ばいばい',e:'👋',v:false}],ok=>{
    if(ok){ join(g);
      Q.unshift(()=>tell(art(g.n,96),hon(g.n)+'も なかまに なった！ '+(NIN[A.party.length]||A.party.length+'にん')+'に なったよ。'));
      if(A.acts<2) Q.splice(1,0,sAct);
      if(A.party.length<3 && Math.random()<0.5) Q.splice(A.acts<2?2:1,0,sMore);
    }else{ Q.unshift(()=>tell(art(g.n,90),hon(g.n)+'に てを ふって ばいばい。 「またね！」')); }
  });
}
function sEventsSetup(){
  const ate=A.tags.includes('gohan');
  const commons=COMMON_EVENTS.filter(ev=>!(ate&&ev.c.every(c=>c.tag==='gohan')));
  const evs=shuffle(Math.random()<0.5?[...pick(A.dest.events,2)]:[...pick(A.dest.events,1),...pick(commons,1)]);
  Q.unshift(...evs.map(ev=>()=>sEvent(ev))); run();
}
function sEvent(ev){ choice('❗',fill(ev.t),ev.c.map(c=>({n:fill(c.n),e:c.e,v:c})),c=>{ addTag(c.tag); Q.unshift(()=>tell(c.e,fill(c.t),c.tag==='gohan'?'food':null)); }); }
function sEnding(){
  const cnt={}; A.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  const max=Math.max(...Object.values(cnt));
  const tops=shuffle(Object.keys(cnt).filter(t=>cnt[t]===max));
  const cand=A.dest.finales;
  let key=null;
  for(const t of tops){ const pref=(TAG_FINALE[t]||[]).find(f=>cand.includes(f)); if(pref){ key=pref; break; } }
  if(!key) key=cand[rnd(cand.length)];
  A.fin=FINALES[key];
  Q.unshift(()=>tellPlain(A.fin.c,fill(A.fin.t)+' '+fill(A.dest.goal)+'おしまい！','ゴール！','🎉',goal));
  run();
}

let drillBag=[];
const DRILL_TYPES=['color','add','count','word','order','alpha','trace'];
const CAN_TRACE=(()=>{try{const e=document.createElementNS('http://www.w3.org/2000/svg','path');
  return typeof e.getTotalLength==='function'&&typeof e.getPointAtLength==='function';}catch(e){return false}})();
function nextDrillType(){ if(!drillBag.length) drillBag=shuffle(DRILL_TYPES); return drillBag.shift(); }

function tell(emoji,text,force){
  let type=force||nextDrillType();
  if(type==='trace'&&(!CAN_TRACE||typeof startTrace!=='function')) type='word';
  if(type==='trace'&&!force){
    /* おはなしに でてきた ことばの 1もじを なぞる（かんたんな もじを えらぶ）*/
    const ob=findObj(text);
    let pool=(ob&&/^[ぁ-ん]+$/.test(ob.w))?ob.w.split('').filter(k=>KANA_PATHS[k]&&KANA_PATHS[k].length<=2):[];
    if(!pool.length) pool=EASY_KANA;
    const ch=pool[rnd(pool.length)];
    return traceDrill(emoji,text,ch,ob);
  }
  if(!force){
    const ob=findObj(text);
    /* おはなしに ものが でてきたら、それに つなげられる ドリルに よせる */
    if(ob){
      const ok=['word','alpha'];
      if(ob.fl.includes('c')) ok.push('color');
      if(ob.fl.includes('m')) ok.push('count','add');
      if(/^[ぁ-ん]{2,3}$/.test(ob.w)) ok.push('order');
      if(!ok.includes(type)) type=ok[rnd(ok.length)];
    }
  }
  drillScene(emoji,text,type);
}

function traceDrill(emoji,text,ch,ob){
  const lead=(ob&&ob.w.includes(ch)?`${ob.w}の 「${ch}」`:`「${ch}」`)+'を ゆびで かいてみよう';
  startTrace(ch,{lead,story:text,scene:scene(emoji,{cls:'mini'}),back:showTitle,
    onDone:()=>{ A.stars++; run(); }});
}
function makeDrill(type,ob){
  const N=ob?ob.w:null;
  if(type==='color'){
    const i=rnd(COLOR_LIST.length), c=COLOR_LIST[i], others=pick(COLOR_LIST,2,i);
    const rad=ob&&ob.shape==='square'?'18px':'50%';
    return {q:N?`この ${N}の いろは なに？`:'この いろは なに？',read:(N?'この '+N+'の いろは なに？':'この いろは なに？'),
      vis:`<div class="cbox" style="background:${c.c};border-radius:${rad}"></div>`,
      ans:c.n,hint:c.n,readOpts:true,
      opts:shuffle([c,...others]).map(o=>({l:o.n,v:o.n}))};
  }
  if(type==='add'){
    const a=1+rnd(4), b=1+rnd(Math.min(4,6-a)), sum=a+b, em=ob?ob.e:ADD_EMOJI[rnd(ADD_EMOJI.length)];
    const pool=[1,2,3,4,5,6,7,8].filter(v=>v!==sum);
    return {q:N?`${N}が ${a}こと ${b}こ。 あわせて いくつ？`:`${a} ＋ ${b} ＝ ？`,
      read:(N?N+'が '+NUM_YOMI[a]+'こと '+NUM_YOMI[b]+'こ。 あわせて いくつ？':a+' たす '+b+' は？'),
      vis:`<div class="vis small">${em.repeat(a)}<span class="eq">＋</span>${em.repeat(b)}<span class="eq">＝ ？</span></div>`,
      ans:String(sum),hint:NUM_YOMI[sum],readOpts:true,
      opts:shuffle([sum,...pick(pool,2)]).map(v=>({l:String(v),v:String(v),big:true}))};
  }
  if(type==='count'){
    const n=1+rnd(10), ce=ob?ob.e:A.dest.ce, others=pick(Array.from({length:10},(_,i)=>i+1),2,n-1);
    return {q:N?`${N}は いくつ あるかな？`:'いくつ あるかな？',read:(N?N+'は いくつ あるかな？':'いくつ あるかな？'),
      vis:`<div class="vis small">${ce.repeat(n)}</div>`,
      ans:String(n),hint:NUM_YOMI[n],readOpts:true,
      opts:shuffle([n,...others]).map(v=>({l:String(v),v:String(v),big:true}))};
  }
  if(type==='word'){
    let w,e,others;
    if(ob){ w=ob.w; e=ob.e; others=pick([...HIRA,...KATA].filter(x=>x[0]!==w),2); }
    else { const pool=Math.random()<0.5?HIRA:KATA, i=rnd(pool.length); [w,e]=pool[i]; others=pick(pool,2,i); }
    return {q:'この えは なに？',read:'この えは なに？',
      vis:`<div class="vis">${e}</div>`,ans:w,hint:w,
      opts:shuffle([[w,e],...others]).map(o=>({l:o[0],v:o[0]}))};
  }
  if(type==='alpha'){
    const i=rnd(26), L=ALPHA[i], others=pick(ALPHA,2,i);
    const lead=N?`${N}に もじが かいてある！ `:'';
    return {q:lead+`「${ALPHA_YOMI[L]}」は どれ？`,read:(N?N+'に もじが かいてあるよ。 ':'')+ALPHA_YOMI[L]+'は どれ？',
      vis:`<div class="vis">「${ALPHA_YOMI[L]}」</div>`,ans:L,hint:ALPHA_YOMI[L],
      opts:shuffle([L,...others]).map(v=>({l:v,v:v,big:true}))};
  }
  if(type==='food'){
    const who=A.party[rnd(A.party.length)];
    const i=rnd(FOODS.length),[fn,fe]=FOODS[i],others=pick(FOODS,2,i);
    return {q:`${hon(who.n)}は 「${fn}」が たべたいって！`,read:hon(who.n)+'は '+fn+'が たべたいって。 '+fn+'は どれ？',
      vis:`<div class="vis">${who.e}<span class="eq">→</span>❓</div>`,
      ans:fn,hint:fn,
      opts:shuffle([[fn,fe],...others]).map(o=>({l:o[1],v:o[0],big:true}))};
  }
  /* order: ひらがなを じゅんばんに えらんで ことばを つくる */
  const pool=HIRA.filter(x=>x[0].length>=2&&x[0].length<=3);
  let w,e;
  if(ob && /^[ぁ-ん]{2,3}$/.test(ob.w)){ w=ob.w; e=ob.e; } else { [w,e]=pool[rnd(pool.length)]; }
  const kana='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん'.split('');
  const extra=shuffle(kana.filter(k=>!w.includes(k))).slice(0,w.length>=3?1:2);
  return {order:true,word:w,q:'じゅんばんに えらんでね',read:'この えは '+w+'。 もじを じゅんばんに えらんでね。',
    vis:`<div class="vis">${e}</div>`,hint:w,
    opts:shuffle([...w.split(''),...extra]).map(k=>({l:k,v:k,big:true}))};
}

function drillScene(emoji,text,type){
  let ob=type==='food'?null:findObj(text);
  if(ob){ const f=ob.fl;
    const fit = type==='word' || type==='order'
      || (type==='color'&&f.includes('c'))
      || ((type==='count'||type==='add')&&f.includes('m'))
      || (type==='alpha'&&f.includes('a'));
    if(!fit) ob=null; }
  const d=makeDrill(type,ob);
  const three=d.opts.length>2;
  const slots=d.order?`<div class="slots">${d.word.split('').map(()=>'<div class="slot"></div>').join('')}</div>`:'';
  app.innerHTML=header()+scene(emoji,{cls:'mini'})+`
    <div class="bubble mini"><div class="txt">${text}</div><button class="say">🔊</button></div>
    <div class="drill"><div class="qq">${d.q}</div>${d.vis||''}${slots}</div>
    <div class="choices ${d.order?'kana':(three?'three':'two')}" ${d.order?`style="grid-template-columns:repeat(${d.opts.length},1fr)"`:''}>${d.opts.map((o,i)=>`<button class="btn ${COLORS[i%5]} ${d.order?'kchip':(o.big?'big':'')} ${!d.order&&three&&!o.big?'sm':''}" data-v="${o.v}" data-i="${i}">${o.l}</button>`).join('')}</div>`;
  bindCommon(clean(text)+' '+d.read);
  if(d.readOpts) speak(clean(text),700,d.read,900,d.opts.map(o=>o.l).join('？ ')+'？');
  else speak(clean(text),700,d.read);

  let locked=false, pos=0;
  const done=()=>{ locked=true; A.stars++; $('.pts').innerHTML='⭐ <span>'+A.stars+'</span>';
    showWord('せいかい！'); burst(14); setTimeout(run,1500); };
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(locked) return;
    if(d.order){
      if(b.dataset.v===d.word[pos]){
        const sl=app.querySelectorAll('.slot')[pos];
        sl.textContent=b.dataset.v; sl.classList.add('fill');
        b.disabled=true; b.style.opacity=.35; pos++;
        if(pos===d.word.length){ speak('せいかい！ '+d.word+'！'); done(); }
        else speak(b.dataset.v);
      }else{ b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); speak('つぎは、',400,d.word[pos]+'！'); }
      return;
    }
    if(b.dataset.v===d.ans){ b.classList.add('right'); speak('せいかい！ '+d.hint+'！'); done(); }
    else{ b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); speak('もういちど。',600,'ヒント、 '+d.hint+'！'); }
  });
}

function showWord(w){ const ov=$('#ov'); $('#ovw').textContent=w; ov.classList.add('on'); setTimeout(()=>ov.classList.remove('on'),1000); }
function burst(n){ const em=['🎉','⭐','🌟','✨','🎈','💖'];
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='conf'; s.textContent=em[rnd(em.length)];
    s.style.left=rnd(100)+'vw'; s.style.top=(-10+rnd(30))+'vh'; s.style.animationDelay=(rnd(400)/1000)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),1800); } }
function particles(emojis,dir,n){
  const out=[];
  for(let i=0;i<n;i++){
    const el=document.createElement('span'); el.className='fp';
    el.textContent=emojis[rnd(emojis.length)];
    el.style.fontSize=(22+rnd(24))+'px';

    el.style.animation=`fp${dir} ${(3.2+Math.random()*2.4).toFixed(1)}s linear ${(Math.random()*2.6).toFixed(1)}s infinite`;
    $('#fin').appendChild(el); out.push(el);
  }

}
function canvasFireworks(ms){
  const cv=$('#fw'),ctx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
  cv.classList.add('on');
  let parts=[],t0=performance.now(),shots=0; const colors=['#ff6f91','#ffd86b','#a6e3a1','#9bd4ff','#cdb4f5','#fff'];
  function shoot(){ const x=W*(0.2+Math.random()*0.6),y=H*(0.12+Math.random()*0.38),c=colors[rnd(colors.length)];
    for(let i=0;i<70;i++){ const a=Math.random()*Math.PI*2,s=2+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c}); } }
  function frame(now){ const el=now-t0; if(el<ms-800&&el>shots*430){shoot();shots++;}
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.vx*=0.98;p.life-=0.012;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();});
    ctx.globalAlpha=1; parts=parts.filter(p=>p.life>0);
    if(el<ms) requestAnimationFrame(frame); else { cv.classList.remove('on'); ctx.clearRect(0,0,W,H); } }
  requestAnimationFrame(frame);
}

  $('#finword').textContent=fin.word; $('#finsub').textContent='⭐ '+pts+' ポイント';
  const ms=reduce?1500:5000;
  const ps=reduce?[]:particles(fin.em,fin.dir,16);
  if(fin.bg==='bg-night'&&!reduce) canvasFireworks(ms);
  speak(fin.say,700,'ほしが '+pts+'ポイント！');
  const close=()=>{ if(finTimer) clearTimeout(finTimer); finTimer=null; box.onclick=null;
    ps.forEach(e=>e.remove()); box.className='fin'; $('#fw').classList.remove('on'); burst(16); onDone(); };
  box.onclick=close;
  finTimer=setTimeout(close,ms);
}
showTitle();
</script>
</body>
</html>
